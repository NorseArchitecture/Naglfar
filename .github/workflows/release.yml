name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  security-events: write
  pull-requests: write

jobs:
  build-test:
    uses: NorseArchitecture/.github/.github/workflows/ci-build-test.yml@master
    secrets: inherit

  codeql-csharp:
    uses: NorseArchitecture/.github/.github/workflows/codeql.yml@master
    secrets: inherit
    with:
      language: csharp

  codeql-js:
    uses: NorseArchitecture/.github/.github/workflows/codeql.yml@master
    secrets: inherit
    with:
      language: javascript-typescript

  # Inlined rather than calling the shared publish-nuget.yml: DesignSystem.Tokens' pack
  # now shells to Bun and Node (Style Dictionary generates FluentTokenSeed.g.cs and the CSS
  # static web asset), so this realm's own publish job needs both on the runner. The shared
  # workflow stays free of them for every other NuGet-only realm.
  publish-nuget:
    needs: [build-test, codeql-csharp, codeql-js]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: dotnet pack -c Release -o ./artifacts/nupkg

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-nuget.cyclonedx.json

      - name: Push to GitHub Packages
        run: dotnet nuget push "./artifacts/nupkg/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/NorseArchitecture/index.json" --skip-duplicate

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-artifacts
          path: |
            ./artifacts/nupkg/*.nupkg
            ./sbom-nuget.cyclonedx.json
          retention-days: 7

  publish-npm:
    needs: [build-test, codeql-csharp, codeql-js]
    uses: NorseArchitecture/.github/.github/workflows/publish-npm.yml@master
    secrets: inherit

  create-release:
    needs: [publish-nuget, publish-npm]
    uses: NorseArchitecture/.github/.github/workflows/create-release.yml@master
    secrets: inherit

  sound-gjallarhorn:
    needs: [publish-nuget]
    uses: NorseArchitecture/.github/.github/workflows/sound-gjallarhorn.yml@master
    secrets:
      token: ${{ secrets.SCATTER_PAT }}
