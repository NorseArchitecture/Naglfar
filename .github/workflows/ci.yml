name: CI

on:
  pull_request:
    branches: [master]

permissions:
  packages: read

jobs:
  gate:
    uses: NorseArchitecture/.github/.github/workflows/ci-build-test-npm.yml@master
    secrets: inherit

  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview
      - run: dotnet test
        env:
          # First org-feed reach for this realm (the scattered Law of the Realms analyzer package,
          # 2026-08-03): restore authenticates exactly as the canonical ci-build-test template does.
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
