name: CI

on:
  pull_request:
    branches: [master]

permissions:
  packages: read

jobs:
  gate:
    uses: NorseArchitecture/.github/.github/workflows/ci-build-test-npm.yml@master
    secrets: inherit

  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test
        env:
          # First org-feed reach for this realm (the scattered Law of the Realms analyzer package,
          # 2026-08-03): restore authenticates exactly as the canonical ci-build-test template does.
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
